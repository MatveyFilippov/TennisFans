# Replace certificate paths with certificates administered by the operator.
server {
    listen 443 ssl;
    server_name tennisfans.ru;
    ssl_certificate /etc/ssl/tennisfans/fullchain.pem;
    ssl_certificate_key /etc/ssl/tennisfans/privkey.pem;
    client_max_body_size 64m;

    location ~ ^/(api/|docs$|openapi\.json$|redoc$|health/ready$) {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:5173;
    }
}
