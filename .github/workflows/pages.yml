name: Publish documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'backend/uv.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennisfans-pages
  cancel-in-progress: false
jobs:
  build:
    name: Package English documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.21
      - run: uv run --locked --project backend --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  publish:
    name: Deploy documentation artifact
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
