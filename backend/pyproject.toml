[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "tennisfans"
version = "1.0.0"
description = "Self-hosted tennis competition and rating API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23,<26",
  "fastapi>=0.119,<1",
  "pillow>=13,<14",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.9,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
tennisfans = "tennisfans.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
]

docs = ["mkdocs-material>=9.7,<10"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
